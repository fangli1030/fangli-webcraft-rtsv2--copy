<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 3 small wooden cabins in a row -->
  <!-- Left cabin -->
  <rect x="2" y="16" width="9" height="12" fill="#8b6914" stroke="#5a4010" stroke-width="0.8"/>
  <polygon points="2,16 6.5,11 11,16" fill="#cc4422" stroke="#7a2010" stroke-width="0.8"/>
  <line x1="2" y1="20" x2="11" y2="20" stroke="#5a4010" stroke-width="0.5"/>
  <line x1="2" y1="24" x2="11" y2="24" stroke="#5a4010" stroke-width="0.5"/>
  <rect x="5" y="22" width="3" height="6" fill="#3a2818"/>
  <!-- Middle cabin (slightly taller) -->
  <rect x="11.5" y="14" width="9" height="14" fill="#a08055" stroke="#5a4010" stroke-width="0.8"/>
  <polygon points="11.5,14 16,8 20.5,14" fill="#dd5533" stroke="#7a2010" stroke-width="0.8"/>
  <line x1="11.5" y1="18" x2="20.5" y2="18" stroke="#5a4010" stroke-width="0.5"/>
  <line x1="11.5" y1="22" x2="20.5" y2="22" stroke="#5a4010" stroke-width="0.5"/>
  <rect x="14.5" y="20" width="3" height="8" fill="#3a2818"/>
  <rect x="13" y="16" width="2" height="2" fill="#ffd700" opacity="0.8"/>
  <rect x="17" y="16" width="2" height="2" fill="#ffd700" opacity="0.8"/>
  <!-- Right cabin -->
  <rect x="21" y="16" width="9" height="12" fill="#8b6914" stroke="#5a4010" stroke-width="0.8"/>
  <polygon points="21,16 25.5,11 30,16" fill="#cc4422" stroke="#7a2010" stroke-width="0.8"/>
  <line x1="21" y1="20" x2="30" y2="20" stroke="#5a4010" stroke-width="0.5"/>
  <line x1="21" y1="24" x2="30" y2="24" stroke="#5a4010" stroke-width="0.5"/>
  <rect x="24" y="22" width="3" height="6" fill="#3a2818"/>
</svg>
