<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Walled medieval town with houses inside -->
  <!-- Outer wall -->
  <rect x="2" y="14" width="28" height="14" fill="#9a8970" stroke="#5a4a3a" stroke-width="1.2"/>
  <!-- Battlements on top of wall -->
  <rect x="2" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <rect x="7" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <rect x="12" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <rect x="17" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <rect x="22" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <rect x="27" y="11" width="3" height="3" fill="#9a8970" stroke="#5a4a3a" stroke-width="0.8"/>
  <!-- Houses peeking over wall -->
  <polygon points="6,8 10,4 14,8 14,14 6,14" fill="#a04030" stroke="#5a2a1a" stroke-width="0.8"/>
  <polygon points="14,9 18,5 22,9 22,14 14,14" fill="#cc5040" stroke="#5a2a1a" stroke-width="0.8"/>
  <!-- Gate -->
  <path d="M14 22 L14 28 L18 28 L18 22 Q18 19, 16 19 Q14 19, 14 22 Z" fill="#3a2818" stroke="#1a1a2e" stroke-width="0.5"/>
  <!-- Wall texture -->
  <line x1="2" y1="20" x2="30" y2="20" stroke="#5a4a3a" stroke-width="0.5"/>
  <line x1="8" y1="14" x2="8" y2="20" stroke="#5a4a3a" stroke-width="0.5"/>
  <line x1="24" y1="14" x2="24" y2="20" stroke="#5a4a3a" stroke-width="0.5"/>
</svg>
