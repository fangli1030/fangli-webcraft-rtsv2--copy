<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Two A-frame cabins with stone chimney - cozy village -->
  <!-- Left A-frame -->
  <polygon points="2,28 9,12 16,28" fill="#7a3a2a" stroke="#3a1810" stroke-width="1"/>
  <polygon points="4,28 9,16 14,28" fill="#cc5544" stroke="#3a1810" stroke-width="0.5" opacity="0.6"/>
  <rect x="7" y="22" width="4" height="6" fill="#3a2818"/>
  <rect x="8" y="23" width="2" height="2" fill="#ffd700" opacity="0.6"/>
  <!-- Right A-frame (slightly smaller) -->
  <polygon points="16,28 22,15 28,28" fill="#8a4a3a" stroke="#3a1810" stroke-width="1"/>
  <polygon points="18,28 22,18 26,28" fill="#dd6655" stroke="#3a1810" stroke-width="0.5" opacity="0.6"/>
  <rect x="20" y="23" width="4" height="5" fill="#3a2818"/>
  <!-- Stone chimney on left -->
  <rect x="11" y="14" width="2.5" height="6" fill="#8a8070" stroke="#5a5040" stroke-width="0.5"/>
  <line x1="11" y1="17" x2="13.5" y2="17" stroke="#5a5040" stroke-width="0.4"/>
  <!-- Smoke -->
  <ellipse cx="13" cy="11" rx="1.5" ry="1" fill="#ddd" opacity="0.5"/>
  <ellipse cx="14" cy="9" rx="2" ry="1.2" fill="#ddd" opacity="0.4"/>
</svg>
