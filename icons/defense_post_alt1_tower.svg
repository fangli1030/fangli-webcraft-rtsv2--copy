<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Watchtower -->
  <!-- Base -->
  <rect x="10" y="20" width="12" height="10" fill="#c9d1d9" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Tower body -->
  <rect x="11" y="10" width="10" height="12" fill="#e6edf3" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Top platform (battlements) -->
  <rect x="9" y="6" width="14" height="5" fill="#c9d1d9" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="9" y="3" width="2" height="3" fill="#c9d1d9" stroke="#6b7280" stroke-width="0.8"/>
  <rect x="13" y="3" width="2" height="3" fill="#c9d1d9" stroke="#6b7280" stroke-width="0.8"/>
  <rect x="17" y="3" width="2" height="3" fill="#c9d1d9" stroke="#6b7280" stroke-width="0.8"/>
  <rect x="21" y="3" width="2" height="3" fill="#c9d1d9" stroke="#6b7280" stroke-width="0.8"/>
  <!-- Window/arrow slit -->
  <rect x="14" y="13" width="4" height="6" fill="#1a1a2e"/>
  <!-- Door -->
  <rect x="13" y="24" width="6" height="6" rx="3" fill="#8b6914"/>
</svg>
