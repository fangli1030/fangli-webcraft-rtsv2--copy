<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Single sword pointing up -->
  <line x1="16" y1="4" x2="16" y2="22" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
  <!-- Crossguard -->
  <line x1="10" y1="22" x2="22" y2="22" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="16" y1="22" x2="16" y2="28" stroke="#8b6914" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="16" cy="29" r="2" fill="#ffd700" stroke="#b8960f" stroke-width="0.5"/>
  <!-- Tip highlight -->
  <polygon points="16,4 18,7 14,7" fill="#ffffff"/>
</svg>
