<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta RTS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="landing-overlay">
    <div class="landing-content">
      <h1 class="landing-title">Meta RTS</h1>
      <div class="landing-input-row">
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
      <button id="play-btn">Play</button>
      <button id="tutorial-btn">Tutorial</button>
    </div>
  </div>
  <script src="game.js?v=2"></script>
</body>
</html>
