[site]
name = "Meta RTS"
url = "https://anujvarma-webcraft-rts-claude.vercel.app"
description = "Real-time strategy territory game where you conquer 80% of the United States to win"
category = "high-end"

[site.tech]
stack = ["HTML", "CSS", "JavaScript", "Canvas 2D", "Web Workers"]
hosting = "Vercel"
hosting_access_granted = true

[site.assets]
images = []
videos = []
models_3d = []
svgs = ["icons/city.svg", "icons/defense_post.svg", "icons/gold.svg", "icons/troop.svg"]

[site.prd]
file = "PRD.md"
setup = "npx serve -l 3000"
backend = "None — fully client-side, simulation runs in a Web Worker"

[[screenshots]]
route = "/"
file = "screenshots/home-desktop.png"
device = "desktop"

[[screenshots]]
route = "/"
file = "screenshots/home-mobile.png"
device = "mobile"

[[screenshots]]
route = "/"
file = "screenshots/gameplay-desktop.png"
device = "desktop"

[task]
format = "web_craft"
workstream = "web_craft"